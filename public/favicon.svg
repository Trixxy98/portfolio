<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- [HF]: code brackets around an H/F ligature (H's right stem is F's stem).
       Drawn on a 4-unit grid so every edge lands on a whole pixel at 16×16. -->
  <style>
    @media (prefers-color-scheme: dark) {
      .tile { fill: #ffffff; }
      .mark { fill: #0a0a0a; }
    }
  </style>
  <rect class="tile" width="64" height="64" rx="14" fill="#0a0a0a"/>
  <g class="mark" fill="#ffffff">
    <path d="M8 12h8v4h-4v32h4v4h-8z"/>
    <path d="M56 12h-8v4h4v32h-4v4h8z"/>
    <rect x="20" y="20" width="4" height="24"/>
    <rect x="32" y="20" width="4" height="24"/>
    <rect x="20" y="30" width="20" height="4"/>
    <rect x="32" y="20" width="12" height="4"/>
  </g>
</svg>
